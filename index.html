<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrendNest</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#f6f1eb;
      color:#1f1a17;
      display:flex;
      justify-content:center;
      padding:40px 16px;
    }
    .wrap{
      width:100%;
      max-width:520px;
    }
    .card{
      background:#fffaf5;
      border:1px solid #e7ddd2;
      border-radius:20px;
      padding:28px;
      box-shadow:0 10px 30px rgba(0,0,0,.06);
    }
    h1{
      margin:0 0 10px;
      font-size:36px;
    }
    p{
      color:#6b625c;
      line-height:1.6;
    }
    .links a, .product a{
      display:block;
      text-decoration:none;
      background:#111;
      color:#fff;
      padding:14px 18px;
      border-radius:14px;
      margin-top:12px;
      text-align:center;
    }
    .section-title{
      margin-top:28px;
      margin-bottom:10px;
      font-size:14px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:#8a7f75;
    }
    .product{
      background:#fff;
      border:1px solid #eee1d5;
      border-radius:16px;
      padding:18px;
      margin-top:14px;
    }
    .product h3{
      margin:0 0 8px;
      font-size:20px;
    }
    .product p{
      margin:0 0 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>TrendNest</h1>
      <p>Curated skincare finds, beauty picks, and trend-led favorites.</p>

      <div class="section-title">My links</div>
      <div class="links">
        <a href="#" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="#" target="_blank" rel="noopener noreferrer">TikTok</a>
        <a href="#" target="_blank" rel="noopener noreferrer">Pinterest</a>
      </div>

      <div class="section-title">Featured product</div>
      <div class="product">
        <h3>Hydrating Skincare Pick</h3>
        <p>Gentle, clean, and selected for daily glow-focused routines.</p>
        <a href="#" target="_blank" rel="noopener noreferrer">AVAILABLE ON AMAZON ✓</a>
      </div>
    </div>
  </div>
</body>
</html>
